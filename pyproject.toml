[project]
name = "rednotebot"
version = "0.1.0"
description = "Use Markdown templates and Playwright to publish Xiaohongshu notes automatically."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright>=1.53.0,<2.0.0",
]

[project.scripts]
rednotebot-publish = "rednotebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rednotebot"]

[tool.uv]
package = true
